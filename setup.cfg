[metadata]
name = yt-dlp-custom-extractors
version = 1.0.0
description = Custom yt-dlp extractor plugins for PimpBunny, TransHub, X-TG, NSFW247, and more
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/Leizer-San/yt-dlp-custom-extractors
license = Unlicense
author = Leizer
license_files = LICENSE

[options]
packages = find_namespace:
python_requires = >=3.8
include_package_data = False
install_requires =
    yt-dlp>=2023.1.2
    curl-cffi>=0.10,<0.15

[options.packages.find]
include =
    yt_dlp_plugins*
